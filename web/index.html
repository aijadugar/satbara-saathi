<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>सातबारा साथी | Satbara Saathi</title>
  <meta name="description" content="७/१२ उतारा सोप्या मराठीत समजून घ्या. हॅकेथॉन प्रोजेक्ट.">
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <!-- TODO: set the real team / event names in BRAND at the top of app.js (not here) -->
  <div class="hack-banner" role="note">
    <span>🏆 <b data-i18n="hack_title"></b> · <span data-i18n="hack_event"></span></span>
    <span class="pill" data-i18n="proto"></span>
  </div>

  <div id="upload" class="screen active">
    <h1 data-i18n="title"></h1>
    <p class="tag" data-i18n="tag"></p>
    <div class="lang-row" role="group" aria-label="Language / भाषा">
      <button data-lang="mr" class="on" aria-pressed="true">मराठी</button>
      <button data-lang="hi" aria-pressed="false">हिंदी</button>
      <button data-lang="en" aria-pressed="false">English</button>
    </div>

    <!-- TODO: confirm each claim below matches what the backend really does before demo day -->
    <div class="trust" data-i18n-label="trust_label">
      <div class="trust-item">
        <span class="ic" aria-hidden="true">🔒</span>
        <span><strong data-i18n="trust1_h"></strong><span data-i18n="trust1_b"></span></span>
      </div>
      <div class="trust-item">
        <span class="ic" aria-hidden="true">⚖️</span>
        <span><strong data-i18n="trust2_h"></strong><span data-i18n="trust2_b"></span></span>
      </div>
      <div class="trust-item">
        <span class="ic" aria-hidden="true">✅</span>
        <span><strong data-i18n="trust3_h"></strong><span data-i18n="trust3_b"></span></span>
      </div>
    </div>

    <details class="how">
      <summary data-i18n="how_sum"></summary>
      <ol>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
      </ol>
    </details>

    <label class="consent"><input type="checkbox" id="consent"> <span data-i18n="consent"></span></label>
    <p id="consent-hint" class="consent-hint" data-i18n="hint"></p>
    <button id="btn-upload" class="big" aria-describedby="consent-hint" disabled data-i18n="upload"></button>
    <input type="file" id="file" accept="image/*,.pdf" hidden>
    <p id="err" class="err" role="alert" hidden></p>
  </div>

  <div id="results" class="screen">
    <h2 data-i18n="results"></h2>
    <span class="ai-badge" data-i18n="ai_badge"></span>
    <div id="summary"></div>
    <div id="flags"></div>
    <div id="checklist"></div>
    <button id="btn-listen" data-i18n="listen"></button>

    <div class="verify-box">
      <span data-i18n="verify_pre"></span>
      <a class="link-verify" href="https://bhulekh.mahabhumi.gov.in" target="_blank" rel="noopener noreferrer" data-i18n="verify_link"></a>
      <span data-i18n="verify_post"></span>
    </div>

    <p class="disc" data-i18n="disc"></p>
    <div class="fb">
      <span data-i18n="fb"></span>
      <button id="fb-yes" data-i18n="fbYes"></button>
      <button id="fb-no" data-i18n="fbNo"></button>
    </div>
  </div>

  <footer class="site-foot">
    <div data-i18n="foot_by"></div>
    <div><a href="https://github.com/aijadugar/satbara-saathi" target="_blank" rel="noopener noreferrer" data-i18n="foot_gh"></a> · <span data-i18n="foot_ver"></span></div>
    <div data-i18n="foot_limit"></div>
  </footer>

  <script src="/static/app.js"></script>
</body>

</html>
